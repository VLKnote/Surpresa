<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma pergunta amor ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA DA PERGUNTA -->
    <main id="telaPergunta" class="tela">

        <div class="caixa">

            <div class="coracao">❤️</div>

            <h1>Uma pergunta amor...</h1>

            <p class="pergunta">
                Você me daria sua bunda gostosa?
            </p>

            <div class="botoes">

                <button id="botaoSim" class="botao sim">
                    SIM ❤️
                </button>

                <button id="botaoNao" class="botao nao">
                    NÃO
                </button>

            </div>

        </div>

    </main>


    <!-- TELA DEPOIS DO SIM -->
    <main id="telaSim" class="tela escondida">

        <div class="caixa galeria-caixa">

            <div class="coracao">❤️</div>

            <h1>Eu sabia! 🥰</h1>

            <p class="mensagem">
                Sabia que você não ia conseguir dizer não para mim.
                ❤️
            </p>


            <!-- GALERIA -->
            <div class="galeria">

                <button id="anterior" class="seta">
                    ‹
                </button>

                <div class="foto-container">

                    <img id="foto" src="fotos/foto1.jpg" alt="Nossa foto">

                    <p id="legenda">
                        Eu te amo muito! ❤️
                    </p>

                </div>

                <button id="proxima" class="seta">
                    ›
                </button>

            </div>


            <p id="contador">
                1 / 3
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
